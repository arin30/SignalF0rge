rules:
  - id: AUTH-001
    title: Repeated failed authentication
    description: Multiple failed logins from the same source IP in a short interval.
    kind: threshold
    source_type: auth
    match:
      action: login_failed
    group_by: src_ip
    threshold: 5
    window_minutes: 10
    severity: medium
    mitre: ["T1110"]

  - id: AUTH-002
    title: Successful login after repeated failures
    description: A successful login occurs shortly after multiple failures for the same user.
    kind: sequence
    source_type: auth
    sequence:
      first:
        action: login_failed
      second:
        action: login_success
    group_by: user
    threshold: 5
    window_minutes: 15
    severity: high
    mitre: ["T1110", "T1078"]

  - id: AUTH-003
    title: Repeated failures against one account
    description: Multiple failed logins target the same user account in a short interval, even if the attempts originate from different sources.
    kind: threshold
    source_type: auth
    match:
      action: login_failed
    group_by: user
    threshold: 6
    window_minutes: 10
    severity: medium
    mitre: ["T1110"]

  - id: AUTH-004
    title: Password spraying across multiple accounts
    description: One source generates failed authentication attempts against several distinct user accounts in a short interval.
    kind: distinct_count
    source_type: auth
    match:
      action: login_failed
    group_by: src_ip
    distinct_field: user
    threshold: 5
    window_minutes: 10
    severity: high
    mitre: ["T1110.003"]

  - id: ENDPOINT-001
    title: Suspicious PowerShell execution
    description: PowerShell command contains common offensive or download-execution indicators.
    kind: contains
    source_type: endpoint
    field: command
    any: ["Invoke-WebRequest", "IEX(", "DownloadString", "FromBase64String", "Invoke-Mimikatz"]
    severity: high
    mitre: ["T1059.001"]

  - id: ENDPOINT-002
    title: Encoded PowerShell command
    description: PowerShell was launched with encoded command arguments.
    kind: contains
    source_type: endpoint
    field: command
    any: ["-enc ", "-encodedcommand"]
    severity: high
    mitre: ["T1059.001", "T1027"]

  - id: ENDPOINT-003
    title: Local administrator account creation
    description: A local account was added to an administrators group.
    kind: contains
    source_type: endpoint
    field: message
    any: ["added to administrators", "added to local administrators"]
    severity: high
    mitre: ["T1136.001", "T1098"]

  - id: ENDPOINT-004
    title: Credential dumping indicator
    description: Endpoint telemetry references credential dumping behavior or LSASS access.
    kind: contains
    source_type: endpoint
    field: message
    any: ["lsass", "credential dump", "mimikatz"]
    severity: critical
    mitre: ["T1003"]

  - id: ENDPOINT-005
    title: Scheduled task creation
    description: A command creates a Windows scheduled task, a common mechanism for persistence or recurring execution.
    kind: contains
    source_type: endpoint
    field: command
    any: ["schtasks /create", "schtasks.exe /create"]
    severity: high
    mitre: ["T1053.005"]

  - id: ENDPOINT-006
    title: Suspicious Windows service creation
    description: A command creates a Windows service, which can be abused for persistence or privileged execution.
    kind: contains
    source_type: endpoint
    field: command
    any: ["sc.exe create", "sc create", "New-Service"]
    severity: high
    mitre: ["T1543.003"]

  - id: ENDPOINT-007
    title: Registry Run Key persistence
    description: A command modifies a common Windows Run key used to launch programs when a user logs in.
    kind: contains
    source_type: endpoint
    field: command
    any: ["currentversion\\run", "currentversion\\runonce"]
    severity: high
    mitre: ["T1547.001"]

  - id: ENDPOINT-008
    title: Endpoint security defenses disabled
    description: A command attempts to disable or stop common Windows endpoint security protections.
    kind: contains
    source_type: endpoint
    field: command
    any: ["Set-MpPreference -DisableRealtimeMonitoring", "sc stop WinDefend", "taskkill /im MsMpEng.exe"]
    severity: critical
    mitre: ["T1562.001"]

  - id: ENDPOINT-009
    title: WMI process execution
    description: A command uses Windows Management Instrumentation to execute activity locally or remotely.
    kind: contains
    source_type: endpoint
    field: command
    any: ["wmic /node:", "Invoke-WmiMethod", "Win32_Process Create"]
    severity: high
    mitre: ["T1047"]

  - id: ENDPOINT-010
    title: Certutil remote file retrieval
    description: The Windows certutil utility is used to retrieve content from a remote location.
    kind: contains
    source_type: endpoint
    field: command
    any: ["certutil -urlcache", "certutil.exe -urlcache"]
    severity: high
    mitre: ["T1105"]

  - id: ENDPOINT-011
    title: Office application spawned a command shell
    description: Endpoint telemetry reports a Microsoft Office application spawning PowerShell or cmd, a suspicious execution chain often associated with malicious documents.
    kind: contains
    source_type: endpoint
    field: message
    any: ["winword.exe spawned powershell.exe", "excel.exe spawned powershell.exe", "excel.exe spawned cmd.exe", "outlook.exe spawned powershell.exe"]
    severity: high
    mitre: ["T1059.001", "T1204.002"]

  - id: ENDPOINT-012
    title: Shadow copy or recovery data deletion
    description: A command attempts to remove shadow copies or recovery catalog data, behavior commonly associated with inhibiting system recovery.
    kind: contains
    source_type: endpoint
    field: command
    any: ["vssadmin delete shadows", "wmic shadowcopy delete", "wbadmin delete catalog"]
    severity: critical
    mitre: ["T1490"]

  - id: ENDPOINT-013
    title: Windows event log clearing
    description: A command attempts to clear Windows event logs and remove local forensic evidence.
    kind: contains
    source_type: endpoint
    field: command
    any: ["wevtutil cl ", "Clear-EventLog"]
    severity: high
    mitre: ["T1070.001"]

  - id: ENDPOINT-014
    title: Host firewall disabled
    description: A command disables Windows host firewall protections across one or more profiles.
    kind: contains
    source_type: endpoint
    field: command
    any: ["netsh advfirewall set allprofiles state off", "Set-NetFirewallProfile -Enabled False"]
    severity: critical
    mitre: ["T1562.004"]

  - id: BEHAVIOR-001
    title: PowerShell followed by credential access
    description: PowerShell execution is followed by LSASS or credential dumping activity on the same host within a short interval.
    kind: multi_sequence
    group_by: host
    window_minutes: 10
    steps:
      - source_type: endpoint
        contains:
          command: ["powershell"]
      - source_type: endpoint
        contains:
          message: ["lsass", "credential dump", "mimikatz"]
    severity: critical
    mitre: ["T1059.001", "T1003.001"]

  - id: NET-001
    title: Connection to high-risk destination port
    description: Connection to a commonly abused management or command-and-control port.
    kind: network_port
    source_type: network
    ports: [22, 23, 3389, 4444, 5900]
    severity: medium
    mitre: ["T1021"]

  - id: NET-002
    title: Repeated denied firewall connections
    description: Multiple denied network events originate from the same source.
    kind: threshold
    source_type: network
    match:
      action: denied
    group_by: src_ip
    threshold: 8
    window_minutes: 5
    severity: medium
    mitre: ["T1046"]

  - id: NET-003
    title: Rapid scan across destination ports
    description: One source contacts many distinct destination ports on a target within a short interval.
    kind: distinct_count
    source_type: network
    group_by: src_ip
    distinct_field: dst_port
    threshold: 10
    window_minutes: 2
    severity: medium
    mitre: ["T1046"]

  - id: NET-004
    title: Rapid connections across many hosts
    description: One source contacts many distinct destination hosts in a short interval, consistent with network discovery or scanning behavior.
    kind: distinct_count
    source_type: network
    group_by: src_ip
    distinct_field: dst_ip
    threshold: 10
    window_minutes: 5
    severity: medium
    mitre: ["T1046"]

  - id: INCIDENT-001
    title: Multi-stage account compromise behavior
    description: A successful authentication is followed by encoded PowerShell, credential access, and an outbound high-risk connection within one correlated activity chain.
    kind: cross_source_sequence
    group_by: correlation_id
    window_minutes: 20
    steps:
      - source_type: auth
        match:
          action: login_success
      - source_type: endpoint
        contains:
          command: ["-enc ", "-encodedcommand"]
      - source_type: endpoint
        contains:
          message: ["lsass", "credential dump", "mimikatz"]
      - source_type: network
        ports: [4444, 5900]
    severity: critical
    mitre: ["T1078", "T1059.001", "T1003.001"]
